# Recovery fine-tune of the EXPERT-PRUNED CIFAR-10-DVS 4-layer dim=192 MoE model.
# Base ckpt: output/truncprune_cifar10dvs_4_192/model_best.pth.tar.
# Deployment prune policy passed on the CLI (--ft-prune ... --exit-threshold-per-expert).
# Keep DVS augmentation on the CLI (--dvs-aug --dvs-trival-aug) to match the base recipe.
#   vs from-scratch truncprune config: trunc_train OFF, EMA ON, short low-LR schedule.
data_dir: /scratch1/bkrhee/data/cifar10-dvs
dataset: cifar10-dvs
pretrained: False
num_classes: 10
num_heads: 8
img_size: 64
crop_pct: 1.0
scale:
    - 1.0
    - 1.0
ratio: [0.2, 1.0]
color_jitter: 0.
interpolation: bicubic
train_interpolation: bicubic
use_conv_as_linear: True
pooling_stat: "0011"
in_channels: 2
time_steps: 16
layer: 4
dim: 192
mlp-ratio: 1
hflip: 0.5

moe-type: allrouted
num_experts: 4
top_k: 1
mixing-mode: none
mix-ratio: 0.5
use_output_lif: False
alternating_moe: False
mlp_ratio_plain: 4
finetune-router: False
TET: False
TET_means: 1.0
TET_lamb: 0.001
trunc_train: False
trunc_min_t: 0

# EMA on -> model_best is the EMA-tracked FT operating point
model-ema: True
model-ema-decay: 0.9998

# Misc — short low-LR recovery schedule (base trained with adamw @1e-2)
seed: 42
amp: True
channels-last: False
batch_size: 16
val_batch_size: 16
lr: 1e-3
min_lr: 3e-4
sched: cosine
weight_decay: 1e-4
epochs: 20
cooldown_epochs: 1
warmup_epochs: 2
warmup_lr: 1e-4
opt: adamw
smoothing: 0.1
workers: 8
