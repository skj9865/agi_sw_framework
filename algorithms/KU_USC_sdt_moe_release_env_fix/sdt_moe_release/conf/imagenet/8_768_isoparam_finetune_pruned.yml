# Inference config for the FT'd ImageNet MoE p90 model (8-layer dim-768 iso-param, mlp-ratio 1,
# 4 experts top-1). TET OFF (model returns averaged (B,cls) so firing_num's accuracy works),
# amp/bicubic/crop_pct 0.95 to match the training-time eval (else ~-0.6%). Deployment prune policy
# is passed on the CLI (--exit-threshold-per-expert = 32 per-expert thresholds).
dataset: imagenet
data_dir: /project2/ppanda_1750/Share/imagenet
num_classes: 1000
num_heads: 8
img_size: 224
in_channels: 3
pooling_stat: '1111'
time_steps: 4
layer: 8
dim: 768
mlp-ratio: 1
use_conv_as_linear: true
interpolation: bicubic
train_interpolation: bicubic
crop_pct: 0.95
mean:
- 0.485
- 0.456
- 0.406
std:
- 0.229
- 0.224
- 0.225

# MoE (allrouted, 4 experts, top-1), iso-param
moe-type: allrouted
num_experts: 4
top_k: 1
mixing-mode: none
mix-ratio: 0.5
use_output_lif: False
alternating_moe: False
mlp_ratio_plain: 4
finetune-router: False
TET: False

# Misc (inference)
amp: true
seed: 42
batch_size: 64
val_batch_size: 64
workers: 8
